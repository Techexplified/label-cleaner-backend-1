<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Label Cleaner Power-Up</title>
    <!-- Official Trello Power-Up Client Library -->
    <script src="https://p.trellocdn.com/power-up.min.js"></script>
  </head>
  <body>
    <script>
      var origin = window.location.origin;
      var iconUrl = origin + '/favicon.svg';

      function openLabelCleanerModal(t) {
        return t.modal({
          title: 'Label Cleaner',
          url: origin + '/index.html',
          fullscreen: true,
          accentColor: '#0C66E4',
          height: 640,
          actions: [
            {
              icon: iconUrl,
              alt: 'Close',
              callback: function (t) {
                return t.closeModal();
              },
            },
          ],
        });
      }

      /* Official Trello Power-Up Initialization */
      window.TrelloPowerUp.initialize({
        // Adds "Label Cleaner" button to the board header
        'board-buttons': function (t, opts) {
          return [
            {
              icon: {
                dark: iconUrl,
                light: iconUrl,
              },
              text: 'Label Cleaner',
              condition: 'always',
              callback: function (t) {
                return openLabelCleanerModal(t);
              },
            },
          ];
        },

        // Power-Up settings capability (also opens Label Cleaner)
        'show-settings': function (t, options) {
          return openLabelCleanerModal(t);
        },

        // Enables Trello card data access for this Power-Up
        'card-badges': function (t, options) {
          return [];
        },

        // Authorization status
        'authorization-status': function (t, options) {
          return t.get('member', 'private', 'trello_token').then(function (token) {
            return { authorized: !!token };
          });
        },

        // Show authorization popup
        'show-authorization': function (t, options) {
          return t.popup({
            title: 'Authorize Label Cleaner',
            url: origin + '/auth.html',
            height: 250,
          });
        },
      });
    </script>
  </body>
</html>
