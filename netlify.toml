[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Content-Security-Policy = "frame-ancestors 'self' https://trello.com https://*.trello.com;"

[[redirects]]
  from = "/connector"
  to = "/connector.html"
  status = 200

[[redirects]]
  from = "/auth"
  to = "/auth.html"
  status = 200
